<html>
  <head>
    <style>
      body {
        background: rgb(30, 30, 30);
        color: rgb(40, 240, 100);
        display: grid;
        place-items: center;
        font-family: monospace;
      }
      #screen {
        font-size: 1vw;
      }
      .display {
        border: 2px solid rgb(40, 240, 100);
        border-radius: 1vw;
        margin-bottom: 1vw;
        padding: 0.7vw 2vw;
      }
      td[id] {
        text-align: right;
        min-width: 8rem;
      }
    </style>
    <script>
      class Display {
        constructor(elt, data, width) {
          this.elt = elt;
          this.data = data;
          this.width = width;
          this.height = Math.ceil(this.data.length / width);
          this.dirty = new Set();
          this.rows = [];
          this.resetStats();
        }

        resetStats() {
          this.orders = 0; // count of calls to order
          this.compares = 0;
          this.swaps = 0;
        }

        setData(data) {
          if (this.data && data.length != this.data.length)
            throw new Error("Data size mismatch");
          this.data = data;
          for (var y = 0; y < self.height; y++) {
            this.dirty.add(y);
          }
          this.resetStats();
        }

        #getLine(y) {
          const ln = y * this.width;
          return new TextDecoder("windows-1251").decode(
            this.data.slice(ln, ln + this.width),
          );
        }

        render() {
          for (var y = 0; y < this.height; y++) {
            const div = document.createElement("div");
            div.innerText = this.#getLine(y);
            this.elt.appendChild(div);
            this.rows.push(div);
            this.dirty.delete(y);
          }
        }

        redraw() {
          for (const y of this.dirty) {
            this.rows[y].innerText = this.#getLine(y);
            this.dirty.delete(y);
          }
        }

        start() {
          window.requestAnimationFrame(() => {
            this.redraw();
            this.start();
          });
        }

        get(offset) {
          if (offset < 0 || offset >= this.data.length)
            throw new Error("Offset out of range");
          return this.data[offset];
        }

        set(offset, v) {
          if (offset < 0 || offset >= this.data.length)
            throw new Error("Offset out of range");
          this.data[offset] = v;
          const ln = Math.floor(offset / this.width);
          this.dirty.add(ln);
        }

        order(off1, off2) {
          this.orders++;
          this.compares++;
          const b1 = this.get(off1);
          const b2 = this.get(off2);

          if (b1 > b2) {
            this.swaps++;
            this.set(off1, b2);
            this.set(off2, b1);
            return true;
          }

          return false;
        }

        wholeChunks(n) {
          const count = Math.floor(this.orders / n);
          this.orders -= count * n; // often count will be 0
          return count;
        }

        async pace(n, ms, updateFn = null) {
          const wait = this.wholeChunks(n) * ms;
          if (wait > 0) {
            if (updateFn) updateFn(this);
            await delay(wait);
          }
        }
      }

      function randomChars(len) {
        const data = new Uint8Array(len);
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.floor(Math.random() * 95 + 32);
        }
        return data;
      }

      function emptyChars(len) {
        return new Uint8Array(len).fill(32);
      }

      function delay(ms) {
        return new Promise((resolve, reject) => {
          setTimeout(resolve, ms);
        });
      }

      async function mixUp(disp) {
        for (var i = 0; i < disp.data.length; i++) {
          disp.set(i, Math.floor(Math.random() * 95 + 32));
          if (i % 7 === 0) await delay(1);
        }
        disp.resetStats();
      }

      async function exchangeSort(disp, updateFn) {
        while (true) {
          var changed = 0;
          for (var i = 0; i < disp.data.length - 1; i++) {
            if (disp.order(i, i + 1)) changed++;
          }
          await disp.pace(250, 1, updateFn);
          if (changed === 0) break;
        }
      }

      async function selectionSort(disp, updateFn) {
        for (var i = 0; i < disp.data.length - 1; i++) {
          for (var j = i + 1; j < disp.data.length; j++) {
            disp.order(i, j);
          }
          await disp.pace(250, 1, updateFn);
        }
      }

      function powerOfTwoStrides(max) {
        var strides = [];
        var stride = 1;
        while (stride < max) {
          strides.push(stride);
          stride *= 2;
        }
        return strides;
      }

      function fibStrides(max) {
        var strides = [];
        var [a, b] = [1, 2];
        while (a < max) {
          strides.push(a);
          [a, b] = [b, a + b];
        }
        return strides;
      }

      const shellSort = (strider) => async (disp, updateFn) => {
        const len = disp.data.length;
        var strides = strider(len);
        while (strides.length) {
          const stride = strides.pop();
          while (true) {
            var changed = 0;
            for (var i = 0; i < len - stride; i++) {
              if (disp.order(i, i + stride)) changed++;
            }
            await disp.pace(250, 1, updateFn);
            if (changed === 0) break;
          }
        }
      };

      const roster = [
        { title: "exchange", fn: exchangeSort },
        { title: "selection", fn: selectionSort },
        {
          title: "shell (power of 2 strides)",
          fn: shellSort(powerOfTwoStrides),
        },
        {
          title: "shell (Fibonacci strides)",
          fn: shellSort(fibStrides),
        },
      ];

      async function main() {
        const title = document.getElementById("title");
        const elt = document.getElementById("screen");
        const disp = new Display(elt, emptyChars(2000), 80);
        disp.render();
        disp.start();

        const update = (disp) => {
          const compare = document.getElementById("compare");
          const swap = document.getElementById("swap");
          compare.innerText = Number(disp.compares).toLocaleString();
          swap.innerText = Number(disp.swaps).toLocaleString();
        };

        var pos = 0;
        while (true) {
          await delay(1500);
          const sortFn = roster[pos++];
          if (pos == roster.length) pos = 0;
          title.innerText = sortFn.title;
          await mixUp(disp);
          await delay(1000);
          await sortFn.fn(disp, update);
        }
      }
    </script>
  </head>
  <body>
    <h1 id="title">Sorts of sorts</h1>
    <div class="display">
      <pre id="screen"></pre>
    </div>
    <table>
      <tr>
        <th>Operation</th>
        <th>Count</th>
      </tr>
      <tr>
        <td>Compare</td>
        <td id="compare">0</td>
      </tr>
      <tr>
        <td>Swap</td>
        <td id="swap">0</td>
      </tr>
    </table>
  </body>
  <script>
    main().then(() => {
      console.log("Done");
    });
  </script>
</html>
